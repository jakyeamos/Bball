services:
  server:
    build:
      context: ..
      dockerfile: deployment/server.Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CLIENT_URL=http://localhost:3000
      - SESSION_SECRET=${SESSION_SECRET:-change-this-in-production}
    volumes:
      # Mount data directory for persistent player data (optional)
      - ../server/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client:
    build:
      context: ..
      dockerfile: deployment/client.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: nba-draft-sim
