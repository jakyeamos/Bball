services:
  # Backend service
  - type: web
    name: nba-draft-sim-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd shared && npm install && npm run build && cd ../server && npm install && npm run build
    startCommand: cd server && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    autoDeploy: true

  # Frontend service (static site)
  - type: web
    name: nba-draft-sim-frontend
    env: static
    region: oregon
    buildCommand: cd shared && npm install && npm run build && cd ../client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
