services:
  # Backend service
  - type: web
    name: nba-draft-sim-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: pnpm install --filter nba-draft-sim-server... --frozen-lockfile && pnpm --filter @nba-draft-sim/shared build && pnpm --filter nba-draft-sim-server build
    startCommand: pnpm --filter nba-draft-sim-server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    autoDeploy: true

  # Frontend service (static site)
  - type: web
    name: nba-draft-sim-frontend
    env: static
    region: oregon
    buildCommand: pnpm install --filter nba-draft-sim-client... --frozen-lockfile && pnpm --filter @nba-draft-sim/shared build && pnpm --filter nba-draft-sim-client build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
