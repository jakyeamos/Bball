[quality_runner]
scan_exclusions = [".venv-nba"]
default_profile = "default"
required_capabilities = ["formatter", "lint", "typecheck", "tests", "build", "dead_code", "runtime_smoke", "pre_pr", "pre_cr"]

[[quality_runner.gates]]
id = "security_dependency_audit"
command = "pnpm dependency:security"
ecosystem = "pnpm"
source = "package.json:scripts.dependency:security"
owner = "repository"
required = true
severity = "blocker"
mutating_risk = "safe"

[[quality_runner.cache_design.paths]]
path = "client/dist"
class = "build_output"
lifecycle = "rebuildable"

[[quality_runner.cache_design.paths]]
path = "server/dist"
class = "build_output"
lifecycle = "rebuildable"

[[quality_runner.cache_design.paths]]
path = "shared/dist"
class = "build_output"
lifecycle = "rebuildable"
